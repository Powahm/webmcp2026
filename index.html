<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Two</title>
<meta name="description" content="A small computer in a browser tab: record, cut, and script it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="menubar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 8h6l2 2h6v8H5V8Z" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">Desk Two</span>
  </div>

  <div class="menubar-right">
    <button class="chip" id="spotlight-open" aria-keyshortcuts="Meta+K Control+K">
      <span>Search</span><kbd class="mono">⌘K</kbd>
    </button>
    <button class="chip icon-chip" id="theme-toggle" aria-label="Switch to dark theme" aria-pressed="false">
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1 5.3 5.3"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
    </button>
    <time class="clock mono" id="clock">--:--</time>
  </div>
</header>

<main class="desktop" id="desktop">
  <div class="doodles" aria-hidden="true">
    <svg class="doodle d1" viewBox="0 0 120 40"><path d="M4 22c14-20 26 16 40-2s26 14 40-6 26 6 32 2"/></svg>
    <svg class="doodle d2" viewBox="0 0 60 60"><path d="M30 4v52M4 30h52M11 11l38 38M49 11 11 49"/></svg>
    <svg class="doodle d3" viewBox="0 0 100 60"><path d="M6 50C6 18 34 6 62 20"/><path d="M50 12l14 7-9 12"/></svg>
    <svg class="doodle d4" viewBox="0 0 80 80"><circle cx="40" cy="40" r="30"/><circle cx="40" cy="40" r="18"/></svg>
  </div>

  <div class="icons" id="icons"></div>

  <p class="hint" id="hint">Record something in <b>Camera</b>, then cut it in <b>Editor</b>. <span class="hint-sub">Or open Scripts and let a program do it.</span></p>
</main>

<nav class="dock" id="dock" aria-label="Open windows" hidden>
  <ul class="dock-list" id="dock-list"></ul>
</nav>

<div class="toaster" id="toaster" aria-live="polite"></div>

<div class="prompter" id="prompter" hidden>
  <div class="prompter-scrim" data-close-prompter></div>
  <div class="prompter-panel" role="dialog" aria-modal="true" aria-label="Teleprompter">
    <header class="prompter-head">
      <span class="prompter-title"></span>
      <button class="btn btn-mini" data-act="prompt-camera">Open Camera</button>
      <button class="btn btn-mini" data-act="prompt-close" aria-label="Close teleprompter">Esc</button>
    </header>
    <div class="prompter-scroll"></div>
    <footer class="prompter-foot">
      <button class="btn btn-mini" data-act="prompt-slower" aria-label="Slower">−</button>
      <span class="prompter-speed mono">1.0×</span>
      <button class="btn btn-mini" data-act="prompt-faster" aria-label="Faster">+</button>
      <button class="btn btn-play" data-act="prompt-play" data-playing="true" aria-label="Pause">
        <svg class="ico-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>
        <svg class="ico-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5h3v11h-3zM8.5 2.5h3v11h-3z"/></svg>
      </button>
    </footer>
  </div>
</div>

<div class="spotlight" id="spotlight" hidden>
  <div class="spotlight-scrim" data-close-spotlight></div>
  <div class="spotlight-panel" role="dialog" aria-modal="true" aria-label="Search">
    <div class="spotlight-field">
      <svg class="spotlight-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="spotlight-input" type="text" placeholder="Search docs, skills, scripts and clips…" autocomplete="off" spellcheck="false" aria-controls="spotlight-results">
      <kbd class="mono">esc</kbd>
    </div>
    <ul class="spotlight-results" id="spotlight-results" role="listbox" aria-label="Results"></ul>
  </div>
</div>

<script src="store.js"></script>
<script src="shell.js"></script>
<script src="camera.js"></script>
<script src="editor.js"></script>
<script src="scripts-app.js"></script>
<script src="skills.js"></script>
<script src="main.js"></script>
</body>
</html>
